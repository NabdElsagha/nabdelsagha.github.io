<div id="rss-news" style="margin-top: 20px;">
    <p style="text-align:center;">جاري تحميل آخر أخبار الذهب والاقتصاد...</p>
</div>

<script>
    async function loadAutoNews() {
        const rssUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https://www.youm7.com/rss/SectionRss?SectionID=297';
        
        try {
            const response = await fetch(rssUrl);
            const data = await response.json();
            let html = '';
            
            data.items.slice(0, 10).forEach(item => {
                html += `
                    <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-right: 4px solid #ffd166;">
                        <h3 style="font-size: 18px; margin-bottom: 5px;"><a href="${item.link}" target="_blank" style="color: #ffd166; text-decoration: none;">${item.title}</a></h3>
                        <p style="font-size: 14px; color: #ccc;">${item.pubDate}</p>
                    </div>
                `;
            });
            
            document.getElementById('rss-news').innerHTML = html;
        } catch (error) {
            document.getElementById('rss-news').innerHTML = '<p>عذراً، فشل تحميل الأخبار حالياً. حاول مرة أخرى.</p>';
        }
    }

    // تشغيل الدالة بمجرد فتح الصفحة
    window.onload = loadAutoNews;
</script>
